[package]
name = "nw"
version = "0.1.0"
edition = "2024"
rust-version = "1.100"
description = "Minimal personal net worth tracker CLI"
license = "BSD-3-Clause"
repository = "https://github.com/nlozgachev/nw"
readme = "README.md"
keywords = ["finance", "net-worth", "cli", "portfolio", "tracker"]
categories = ["command-line-utilities"]

[lib]
name = "nw"
path = "src/lib.rs"

[[bin]]
name = "nw"
path = "src/main.rs"

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["clock", "std", "serde"] }
clap = { version = "4.5", features = ["derive", "env"] }
clap_complete = "4.5"
comfy-table = "7.2"
rust_decimal = { version = "1.36", features = ["serde", "serde-with-arbitrary-precision"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["arbitrary_precision"] }
tempfile = "3"
thiserror = "2.0"

[dev-dependencies]
assert_cmd = "2"
predicates = "3"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true

[lints.rust]
missing_debug_implementations = "warn"
unreachable_pub = "warn"
unused_qualifications = "warn"
trivial_casts = "warn"
trivial_numeric_casts = "warn"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
unwrap_in_result = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
dbg_macro = "deny"
print_stdout = "deny"
print_stderr = "deny"
exit = "deny"
indexing_slicing = "warn"
unreachable = "warn"
map_err_ignore = "warn"
rest_pat_in_fully_bound_structs = "warn"
self_named_module_files = "warn"
lossy_float_literal = "warn"
module_name_repetitions = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
must_use_candidate = "allow"
option_if_let_else = "allow"
